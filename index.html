<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra Cứu Học Tập - CLB Kiện Tướng Tương Lai</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Poppins', sans-serif; background: transparent; margin: 0; padding: 10px; }
.container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0; }
h2 { color: #d4af37; font-weight: 800; margin-top: 0; letter-spacing: 0.5px; }
p { color: #475569; margin-bottom: 25px; font-size: 15px; }
.search-box { display: flex; gap: 10px; justify-content: center; }
input { padding: 14px 20px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; width: 65%; outline: none; transition: 0.2s; }
input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
button { padding: 14px 25px; font-size: 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap; }
button:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.2); }

#searchResultArea { margin-top: 35px; text-align: left; display: none; }

.student-card { background: white; border: 1px solid #cbd5e1; border-radius: 12px; padding: 25px; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
.card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px; }
.card-header h4 { margin: 0; color: #1e293b; font-size: 22px; font-weight: 800; }
.score-badge { background: #eff6ff; color: #2563eb; padding: 6px 14px; border-radius: 20px; font-size: 15px; font-weight: 700; border: 1px solid #bfdbfe; }

.info-row { font-size: 14px; color: #334155; margin-bottom: 10px; }
.info-row strong { color: #475569; }

/* Chia cột linh hoạt */
.notes-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; margin-bottom: 20px; }
.notes-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; margin-bottom: 20px; }

.note-box { padding: 15px; border-radius: 10px; }
.note-box strong { display: block; margin-bottom: 10px; font-size: 14px; }

.note-list { font-size: 13.5px; color: #334155; max-height: 180px; overflow-y: auto; padding-right: 5px; line-height: 1.6; }
.note-item { margin-bottom: 8px; padding-left: 14px; text-indent: -14px; }
.note-item::before { content: "•"; color: currentColor; margin-right: 6px; font-weight: bold; }

/* Tùy chỉnh thanh cuộn đẹp */
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

/* Tối ưu hóa cho thiết bị di động */
@media (max-width: 768px) {
    .notes-grid-3, .notes-grid-2 { grid-template-columns: 1fr; }
    input { width: 55%; }
    .card-header { flex-direction: column; gap: 10px; align-items: flex-start; }
    .container { padding: 20px 15px; }
}
</style>
</head>
<body>
<div class="container">
<h2>🔍 CỔNG TRA CỨU THÔNG TIN HỌC SINH CLB KIỆN TƯỚNG TƯƠNG LAI</h2>
<p>Tra cứu thông tin/thành tích học tập chi tiết của học viên.</p>

<div class="search-box">
    <input type="tel" id="parentSearchInput" placeholder="Nhập ĐÚNG VÀ ĐỦ SĐT Bố/Mẹ (VD: 0912345678)">
    <button onclick="searchStudentOnWeb()">Tra Cứu</button>
</div>

<div id="searchResultArea"></div>
</div>

<script>
// ==============================================================
// 🟢 BỘ CÔNG CỤ BẢO MẬT (CHUNG CHÌA KHÓA VỚI APP QUẢN LÝ)
// ==============================================================
function encodeSecretData(text) {
    if (!text || text.trim() === '') return '';
    const key = "KTTL_SECURE_2026"; // Chìa khóa xào trộn đồng bộ với phần mềm
    
    const utf8Text = unescape(encodeURIComponent(text.trim()));
    let res = '';
    for(let i = 0; i < utf8Text.length; i++) {
        res += String.fromCharCode(utf8Text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return window.btoa(res); 
}

// Hàm quy đổi ngày sang Thứ
const getDayName = (dateStr) => {
    const parts = dateStr.split('/');
    if (parts.length !== 3) return 'Ngày';
    const d = new Date(parts[2], parts[1] - 1, parts[0]);
    const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    return days[d.getDay()];
};

async function searchStudentOnWeb() {
    const query = document.getElementById('parentSearchInput').value.trim();
    const resultArea = document.getElementById('searchResultArea');
    
    // Yêu cầu nhập ít nhất 8-10 số để tránh nhập bừa
    if (!query || query.length < 8) {
        alert('Vui lòng nhập ĐẦY ĐỦ và CHÍNH XÁC số điện thoại đã đăng ký!');
        return;
    }

    resultArea.style.display = 'block';
    resultArea.innerHTML = '<p style="text-align:center; color:#64748b; font-weight: 600;">⏳ Đang kiểm tra hệ thống bảo mật...</p>';

    // 🔒 MÃ HÓA SĐT MÀ PHỤ HUYNH VỪA NHẬP ĐỂ TÌM KIẾM
    const hashedQuery = encodeSecretData(query);

    const dataUrl = 'public_students.json';

    try {
        const response = await fetch(dataUrl + '?t=' + new Date().getTime());
        if (!response.ok) throw new Error('File không tồn tại');
        const allStudents = await response.json();

        // 🔒 TÌM KIẾM DỰA TRÊN CHUỖI ĐÃ MÃ HÓA (CHỐNG LỘ DATA)
        const matchedStudents = allStudents.filter(s => 
            (s.phoneDad && s.phoneDad === hashedQuery) || 
            (s.phoneMom && s.phoneMom === hashedQuery)
        );

        if (matchedStudents.length === 0) {
            resultArea.innerHTML = '<div style="background: #fef2f2; border: 1px solid #fecaca; padding: 15px; border-radius: 8px; color:#ef4444; font-weight:bold; text-align: center;">❌ Không tìm thấy kỳ thủ nào. Vui lòng kiểm tra lại xem bạn đã gõ chính xác 100% SĐT chưa.</div>';
            return;
        }

        // 🟢 THUẬT TOÁN BÓC TÁCH NGÀY/GIỜ VÀ ÉP SẮP XẾP MỚI NHẤT LÊN ĐẦU
        const formatList = (str, emptyMsg) => {
            if (!str) return `<div style="color:#94a3b8; font-style:italic;">${emptyMsg}</div>`;
            const items = str.split(/\r?\n|\\n/).filter(i => i.trim() !== '');
            if (items.length === 0) return `<div style="color:#94a3b8; font-style:italic;">${emptyMsg}</div>`;
            
            // Đọc ngày tháng trong ngoặc vuông để phân loại Cũ - Mới
            items.sort((a, b) => {
                const extractTime = (text) => {
                    // Bắt định dạng ngày: [29/4/2026] hoặc [23/5]
                    const dateMatch = text.match(/\[(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\]/);
                    let time = 0;
                    if (dateMatch) {
                        const day = parseInt(dateMatch[1]);
                        const month = parseInt(dateMatch[2]);
                        const year = dateMatch[3] ? parseInt(dateMatch[3]) : new Date().getFullYear();
                        time = new Date(year, month - 1, day).getTime();
                    }
                    // Bắt thêm định dạng giờ (nếu có): [12:02]
                    const timeMatch = text.match(/\[(\d{1,2}):(\d{2})\]/);
                    if (timeMatch) {
                        time += (parseInt(timeMatch[1]) * 60 + parseInt(timeMatch[2])) * 60000;
                    }
                    return time;
                };
                // B trừ A = Trả về dòng có thời gian lớn nhất (Mới nhất) lên đầu
                return extractTime(b) - extractTime(a);
            });

            return items.map(item => `<div class="note-item">${item}</div>`).join('');
        };

        let htmlOutput = `<h3 style="color:#10b981; border-bottom: 2px dashed #bbf7d0; padding-bottom: 12px; margin-top: 0; text-align: center;">✅ TÌM THẤY ${matchedStudents.length} HỌC SINH</h3>`;
        
        matchedStudents.forEach(st => {
            // 🟢 ĐẢM BẢO LƯỚI ĐIỂM DANH LUÔN LÀ MỚI NHẤT LÊN ĐẦU
            let attendanceHtml = '';
            if (st.attendanceDetails && st.attendanceDetails.length > 0) {
                const sortedAttendance = [...st.attendanceDetails].sort((a, b) => {
                    const pa = a.date.split('/');
                    const pb = b.date.split('/');
                    const dateA = new Date(pa[2] || new Date().getFullYear(), (pa[1] || 1) - 1, pa[0] || 1).getTime();
                    const dateB = new Date(pb[2] || new Date().getFullYear(), (pb[1] || 1) - 1, pb[0] || 1).getTime();
                    return dateB - dateA;
                });

                attendanceHtml = sortedAttendance.map(att => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="display: inline-flex; align-items: center; justify-content: center; width: 42px; font-size: 11px; font-weight: 700; color: #64748b; background: #f8fafc; padding: 4px 0; border-radius: 6px; border: 1px solid #e2e8f0;">${getDayName(att.date)}</span>
                            <span style="font-weight: 600; color: #334155; font-size: 14px;">${att.date}</span>
                        </div>
                        <span style="color: #0ea5e9; font-size: 12px; background: #f0f9ff; padding: 4px 10px; border-radius: 20px; border: 1px solid #bae6fd; font-weight: 600; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            🏫 ${att.className}
                        </span>
                    </div>
                `).join('');
            } else {
                attendanceHtml = '<div style="color:#94a3b8; font-style:italic; padding: 15px; text-align: center;">Chưa có dữ liệu điểm danh</div>';
            }

            htmlOutput += `
                <div class="student-card">
                    <div class="card-header">
                        <h4>🎓 ${st.name} <span style="font-size:15px; color:#64748b; font-weight:600;">(${st.birthYear || 'N/A'})</span></h4>
                        <div class="score-badge">⭐ ${st.score || 0} Điểm</div>
                    </div>

                    <div class="info-row">🎮 <strong>ID Lichess:</strong> <span style="color:#f59e0b; font-weight:700;">${st.lichessId || 'Chưa cập nhật'}</span></div>
                    <div class="info-row">📝 <strong>Nhận xét chung:</strong> <em style="color:#475569;">${st.notes || 'Chưa có ghi chú'}</em></div>
                    
                    <div class="notes-grid-3">
                        <div class="note-box" style="background: #f0fdf4; border: 1px solid #bbf7d0;">
                            <strong style="color:#16a34a;">✅ Khen thưởng</strong>
                            <div class="note-list custom-scrollbar">${formatList(st.goodDeeds, 'Chưa có ghi nhận')}</div>
                        </div>
                        <div class="note-box" style="background: #fef2f2; border: 1px solid #fecaca;">
                            <strong style="color:#dc2626;">❌ Nhắc nhở</strong>
                            <div class="note-list custom-scrollbar">${formatList(st.badDeeds, 'Chưa có ghi nhận')}</div>
                        </div>
                        <div class="note-box" style="background: #faf5ff; border: 1px solid #e9d5ff;">
                            <strong style="color:#9333ea;">🎁 Phần thưởng</strong>
                            <div class="note-list custom-scrollbar">${formatList(st.gifts, 'Chưa có ghi nhận')}</div>
                        </div>
                    </div>

                    <div class="notes-grid-2" style="margin-top: 0;">
                        
                        <div class="note-box" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 0; overflow: hidden; display: flex; flex-direction: column;">
                            <strong style="color:#475569; padding: 12px 15px; margin: 0; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                                <span>📆 Chi tiết Điểm danh</span>
                            </strong>
                            <div class="custom-scrollbar" style="height: 280px; overflow-y: auto; padding: 5px;">
                                ${attendanceHtml}
                            </div>
                        </div>

                        <div class="note-box" style="background: #eff6ff; border: 1px solid #bfdbfe; padding: 0; overflow: hidden; display: flex; flex-direction: column;">
                            <strong style="color:#1d4ed8; padding: 12px 15px; margin: 0; background: #dbeafe; border-bottom: 1px solid #bfdbfe; display: flex; justify-content: space-between; align-items: center;">
                                <span>📊 Lịch sử Điểm số</span>
                            </strong>
                            <div class="note-list custom-scrollbar" style="height: 280px; max-height: 280px; padding: 15px;">
                                ${formatList(st.scoreHistory, 'Học sinh chưa có lịch sử điểm')}
                            </div>
                        </div>
                        
                    </div>
                </div>
            `;
        });

        resultArea.innerHTML = htmlOutput;

    } catch (error) {
        resultArea.innerHTML = '<div style="background: #fef2f2; border: 1px solid #fecaca; padding: 15px; border-radius: 8px; color:#ef4444; font-weight:bold; text-align: center;">❌ Cổng tra cứu đang bảo trì. Hãy đợi thầy cô đồng bộ dữ liệu nhé!</div>';
    }
}

document.getElementById("parentSearchInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        searchStudentOnWeb();
    }
});
</script>
</body>
</html>
